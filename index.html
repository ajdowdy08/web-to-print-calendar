<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Printable Year Calendar</title>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --page-width: 10.3in;
        --page-height: 7.8in;
        --grid-border: #aaa;
        --text-color: #222;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #e9e9e9;
        color: var(--text-color);
        font-family: Arial, Helvetica, sans-serif;
      }

      /* CONTROLS */

      .toolbar {
        max-width: var(--page-width);
        margin: 0 auto 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .toolbar h1 {
        font-size: 22px;
        font-weight: 400;
        margin: 0;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      select,
      button {
        font: inherit;
        font-size: 14px;
        padding: 9px 13px;
        background: white;
        color: #222;
        border: 1px solid #bbb;
        border-radius: 5px;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        background: #f4f4f4;
      }

      /* MONTHLY PRINT SHEETS */

      #calendar {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
      }

      .month-sheet {
        width: var(--page-width);
        height: var(--page-height);
        background: #fff;
        padding: 0;
        display: flex;
        flex-direction: column;
        flex: none;
        overflow: hidden;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
      }

      /* MONTH HEADER */

      .month-header {
        height: 1.55in;
        min-height: 1.55in;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        padding: 0 0 15px;
      }

      .month-heading {
        margin: 0;
        font-size: 64px;
        line-height: 1;
        font-weight: 300;
        letter-spacing: -2px;
        white-space: nowrap;
      }

      .month-heading .year {
        font-weight: 200;
      }

      /* THREE MINI CALENDARS */

      .mini-calendars {
        display: flex;
        gap: 13px;
        flex-shrink: 0;
        align-items: flex-end;
      }

      .mini-calendar {
        width: 94px;
      }

      .mini-title {
        text-align: center;
        font-size: 9px;
        margin-bottom: 4px;
        color: #444;
        font-weight: 600;
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px 0;
        font-size: 7px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .mini-grid span {
        line-height: 1.4;
        min-height: 10px;
      }

      .mini-grid .mini-weekday {
        font-weight: bold;
        color: #555;
      }

      .mini-grid .mini-outside {
        color: #bbb;
      }

      .mini-calendar.active .mini-title {
        font-weight: 700;
        color: #111;
      }

      /* MAIN MONTH GRID */

      .month-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-top: 1px solid var(--grid-border);
        border-left: 1px solid var(--grid-border);
      }

      .weekday,
      .day {
        border-right: 1px solid var(--grid-border);
        border-bottom: 1px solid var(--grid-border);
        min-width: 0;
      }

      .weekday {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        background: #fff;
      }

      .day {
        position: relative;
        padding: 10px;
        font-size: 13px;
        background: #fff;
      }

      .date-number {
        display: inline-block;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      .day.outside .date-number {
        color: #999;
      }

      .day.today .date-number {
        font-weight: bold;
      }

      /* MOBILE / NARROW PREVIEW */

      .preview-scroll {
        overflow-x: auto;
        width: 100%;
      }

      @media screen and (max-width: 1050px) {
        body {
          padding: 12px;
        }

        .toolbar {
          align-items: flex-start;
        }

        #calendar {
          align-items: flex-start;
        }
      }

      /* PRINT SETTINGS */

      @page {
        size: letter landscape;
        margin: 0;
      }

      @media print {
        html,
        body {
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          width: 100% !important;
        }

        .toolbar {
          display: none !important;
        }

        .preview-scroll {
          overflow: visible !important;
          width: 100% !important;
        }

        #calendar {
          display: block !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .month-sheet {
          width: 11in !important;
          height: 8.5in !important;

          margin: 0 !important;
          padding: 0.35in !important;

          box-sizing: border-box !important;

          box-shadow: none !important;
          overflow: hidden !important;

          display: flex !important;
          flex-direction: column !important;

          break-inside: avoid !important;
          page-break-inside: avoid !important;

          break-after: page;
          page-break-after: always;
        }

        .month-sheet:last-child {
          break-after: auto !important;
          page-break-after: auto !important;
        }

        .weekday,
        .day {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
  </head>

  <body>
    <header class="toolbar">
      <h1>Printable Calendar</h1>

      <div class="controls">
        <label for="year-select">Year</label>
        <select id="year-select" aria-label="Calendar year"></select>
        <button type="button" id="current-year">Current Year</button>
        <button type="button" id="print">Print Entire Year</button>
      </div>
    </header>

    <main class="preview-scroll">
      <div id="calendar" aria-label="Annual calendar"></div>
    </main>

    <script>
      (function () {
        "use strict";

        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        const weekdays = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];

        const shortWeekdays = ["S", "M", "T", "W", "T", "F", "S"];

        const today = new Date();

        const calendar = document.getElementById("calendar");
        const yearSelect = document.getElementById("year-select");

        /* YEAR DROPDOWN */

        function initializeYearDropdown() {
          const currentYear = today.getFullYear();

          for (let year = 1900; year <= 2100; year++) {
            const option = document.createElement("option");
            option.value = year;
            option.textContent = year;

            if (year === currentYear) {
              option.selected = true;
            }

            yearSelect.appendChild(option);
          }
        }

        /* DATE UTILITIES */

        function sameDay(a, b) {
          return (
            a.getFullYear() === b.getFullYear() &&
            a.getMonth() === b.getMonth() &&
            a.getDate() === b.getDate()
          );
        }

        function getMonthInformation(year, month) {
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();

          const weekCount = Math.ceil((firstDay + daysInMonth) / 7);

          return {
            firstDay,
            daysInMonth,
            weekCount,
          };
        }

        /* MINI CALENDARS */

        function createMiniCalendar(year, month, active) {
          const date = new Date(year, month, 1);
          const actualYear = date.getFullYear();
          const actualMonth = date.getMonth();

          const info = getMonthInformation(actualYear, actualMonth);

          const mini = document.createElement("div");
          mini.className = "mini-calendar";

          if (active) {
            mini.classList.add("active");
          }

          const title = document.createElement("div");
          title.className = "mini-title";
          title.textContent = monthNames[actualMonth] + " " + actualYear;

          mini.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "mini-grid";

          shortWeekdays.forEach((name) => {
            const heading = document.createElement("span");
            heading.className = "mini-weekday";
            heading.textContent = name;
            grid.appendChild(heading);
          });

          const totalCells = info.weekCount * 7;

          for (let i = 0; i < totalCells; i++) {
            const cellDate = new Date(
              actualYear,
              actualMonth,
              i - info.firstDay + 1,
            );

            const cell = document.createElement("span");

            if (cellDate.getMonth() !== actualMonth) {
              cell.className = "mini-outside";
              cell.textContent = "";
            } else {
              cell.textContent = cellDate.getDate();
            }

            grid.appendChild(cell);
          }

          mini.appendChild(grid);

          return mini;
        }

        /* MAIN CALENDAR CELLS */

        function createDayCell(date, targetMonth) {
          const cell = document.createElement("div");
          cell.className = "day";

          const inMonth = date.getMonth() === targetMonth;

          if (!inMonth) {
            cell.classList.add("outside");
          }

          if (sameDay(date, today)) {
            cell.classList.add("today");
          }

          const number = document.createElement("span");
          number.className = "date-number";
          number.textContent = date.getDate();

          cell.appendChild(number);

          cell.setAttribute(
            "aria-label",
            monthNames[date.getMonth()] +
              " " +
              date.getDate() +
              ", " +
              date.getFullYear(),
          );

          return cell;
        }

        /* GENERATE ONE MONTH PAGE */

        function createMonthSheet(year, month) {
          const sheet = document.createElement("section");
          sheet.className = "month-sheet";

          sheet.setAttribute("aria-label", monthNames[month] + " " + year);

          /* Header */

          const header = document.createElement("header");
          header.className = "month-header";

          const heading = document.createElement("h2");
          heading.className = "month-heading";

          const monthText = document.createElement("span");
          monthText.textContent = monthNames[month] + " ";

          const yearText = document.createElement("span");
          yearText.className = "year";
          yearText.textContent = year;

          heading.appendChild(monthText);
          heading.appendChild(yearText);

          header.appendChild(heading);

          /* Previous, current and next mini calendars */

          const miniWrapper = document.createElement("div");
          miniWrapper.className = "mini-calendars";

          miniWrapper.appendChild(createMiniCalendar(year, month - 1, false));

          miniWrapper.appendChild(createMiniCalendar(year, month, true));

          miniWrapper.appendChild(createMiniCalendar(year, month + 1, false));

          header.appendChild(miniWrapper);
          sheet.appendChild(header);

          /* Calendar grid */

          const info = getMonthInformation(year, month);

          const grid = document.createElement("div");
          grid.className = "month-grid";

          /*
      One row for weekday headings, followed by
      either 4, 5 or 6 complete calendar weeks.
      The day rows expand to fill the page.
    */

          grid.style.gridTemplateRows =
            "0.38in repeat(" + info.weekCount + ", minmax(0, 1fr))";

          weekdays.forEach((name) => {
            const heading = document.createElement("div");
            heading.className = "weekday";
            heading.textContent = name;
            grid.appendChild(heading);
          });

          const totalCells = info.weekCount * 7;

          for (let i = 0; i < totalCells; i++) {
            const date = new Date(year, month, i - info.firstDay + 1);

            grid.appendChild(createDayCell(date, month));
          }

          sheet.appendChild(grid);

          return sheet;
        }

        /* GENERATE ENTIRE YEAR */

        function renderYear(year) {
          const fragment = document.createDocumentFragment();

          for (let month = 0; month < 12; month++) {
            fragment.appendChild(createMonthSheet(year, month));
          }

          calendar.replaceChildren(fragment);

          document.title = year + " Printable Calendar";
        }

        /* EVENTS */

        yearSelect.addEventListener("change", function () {
          renderYear(Number(yearSelect.value));
        });

        document
          .getElementById("current-year")
          .addEventListener("click", function () {
            const year = today.getFullYear();
            yearSelect.value = year;
            renderYear(year);
          });

        document.getElementById("print").addEventListener("click", function () {
          window.print();
        });

        /* INITIALIZE */

        initializeYearDropdown();
        renderYear(today.getFullYear());
      })();
    </script>
  </body>
</html>
